services:
  - type: web
    name: stoktakip
    env: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt && cd ../frontend && npm install && npm run build
    startCommand: cd backend && gunicorn --bind 0.0.0.0:$PORT run:app
    envVars:
      - key: APP_DEBUG
        value: false
      - key: APP_HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.11.9
